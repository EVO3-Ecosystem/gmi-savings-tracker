# Manual check that the portal is reachable and the extract step still works end to end.
# The pipeline runs locally by decision (no cloud); this workflow only runs when started by hand.
name: Extract smoke test
on: workflow_dispatch
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: python -m src.pipeline.extract
        env: {MD_SODA_APP_TOKEN: "${{ secrets.MD_SODA_APP_TOKEN }}"}
      - run: pytest -q
      - uses: actions/upload-artifact@v4
        with: {name: manifest, path: "data/raw/*/manifest.json"}
