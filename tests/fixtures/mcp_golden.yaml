# Golden questions for the MCP server (tests/test_mcp.py). Each question is answered by calling a tool through the MCP
# protocol in-process; the expected answer comes from expected_sql, run by the test on its own DuckDB connection straight
# against the same data (Parquet files or the database file), not through the server.
#   answer: path into the tool's structured result: a.b.0.c, a.*.c (map over a list), a[k=v].c (first item with k == v),
#           len:a (length of a list)
#   expected_sql: {name} is replaced by the table's source (read_parquet('<export>/parquet/name.parquet') or md.mart.name).
#           It returns one row (a scalar, first column), or with expect: list the first column of every row.
#   tol: absolute tolerance for numbers (default 0.005: money to the cent)
- id: q01
  question: What did the State Department of Education (R00) pay out in FY2025?
  tool: agency_spending
  args: {agency: R00, fiscal_year: 2025}
  answer: rows.0.payments
  expected_sql: SELECT payments FROM {f_agency} WHERE agency_code = 'R00' AND fiscal_year = 2025
- id: q02
  question: What was R00's FY2025 operating spending?
  tool: agency_spending
  args: {agency: R00, fiscal_year: 2025}
  answer: rows.0.operating_spending
  expected_sql: SELECT operating_spending FROM {f_agency} WHERE agency_code = 'R00' AND fiscal_year = 2025
- id: q03
  question: How much of the Maryland Department of Health's FY2025 spending was controllable purchases?
  tool: agency_spending
  args: {agency: Maryland Department of Health, fiscal_year: 2025}
  answer: rows.0.controllable
  expected_sql: SELECT controllable FROM {f_agency} WHERE agency = 'Maryland Department of Health' AND fiscal_year = 2025
