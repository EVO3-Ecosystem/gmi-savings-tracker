# Assumptions behind the forecasts (src/models/forecast.py). Change a value here, not in code.

forecast:
  first_actual_fy: 2017        # the series starts here (earlier years are not in the operating budget data)
  last_actual_fy: 2025         # last year with a confirmed actual; later years are the State's own plan, never used to fit
  horizon_fy: 2031             # forecast through this fiscal year
  bootstrap_paths: 4000        # simulated paths per area for the p10 / p50 / p90 range
  seed: 11                     # fixed so a rebuild reproduces the same ranges
  selection: rolling_origin_mase  # method choice: lowest mean MASE over the rolling origins (legacy_single_split = the legacy rule)
  selection_fit_end_fy: 2022   # legacy rule only: fit through this year, score the years after it
  rolling_min_train_years: 5   # rolling-origin backtest: smallest training window
  rolling_max_horizon: 3       # rolling-origin backtest: longest horizon scored from each origin
  backtest_bootstrap_paths: 500   # paths per origin for the backtest's ranges (the published forecasts use bootstrap_paths)
  rolling_score_through_fy: 2027  # years up to the last actual are scored against actuals; later years against the State's plan

# GMI's recurring savings by focus area (Joint Chairmen's Report, Jan 26, 2026): the middle of each reported range,
# summed over the saving IDs listed (see reference/gmi_reported_savings.csv). Areas not listed get no default rate.
gmi_recurring:
  "Fleet & fuel":
    savings: [S08, S09]
    note: "fuel and maintenance $0.8M + maintenance vendors $1.3M"
  "Telecom":
    savings: [S10, S11, S12]
    note: "phone lines $0.5M + plan catalog $2.1-2.3M + copper lines $1.4-1.7M"
  "IT hardware, software & services":
    savings: [S13, S14, S15]
    note: "laptop refresh $1.5M + specifications $1.5M + pricing $1.9M"
  "Print, copy & mail":
    savings: [S16]
    note: "shipping contract $0.8M"
  "Other controllable purchases":
    savings: [S01]
    note: "contract renegotiation $18M year over year"

# Screening assumptions for the opportunity detectors (src/models/opportunities.py), carried over from the legacy
# pipeline. The saving rates are screening percentages, not forecasts: see the Assumptions register in
# docs/data-governance.md. Change a value here, not in code.
opportunities:
  current_fy: 2025             # budget detectors look at this actual year ...
  base_fy: 2022                # ... and, for growth, compare it with this one
  payments_fy: 2026            # payment detectors (tail spend, leverage, bid list) use this year
  peer_gap:
    min_positions: 50          # agencies with fewer budgeted positions are not compared
    min_agencies: 8            # a spending code needs this many comparable agencies
    min_budget: 250000         # ignore findings smaller than this
    percentile: 0.75           # spending per position above this percentile of peer agencies
    share_low: 0.05            # saving = this share of the excess above the percentile ...
    share_high: 0.15
    cap_low: 0.03              # ... but at most this share of the agency's spending on the code
    cap_high: 0.10
  growth:
    points_above_state: 0.25   # grew this many points faster than the state's spending on the same code
    min_budget: 500000
    min_base_budget: 0         # the prior-year spending must exceed this (0 = legacy: any positive base). Roadmap gap 7 suggests about 1,000,000
    share_low: 0.10            # saving = this share of the growth above the state's pace
    share_high: 0.30
  tail_spend:
    top_vendors: 10            # vendors outside the largest N in a focus area
    min_tail: 1000000
    rate_low: 0.03
    rate_high: 0.10
  leverage:
    min_agencies: 10           # one vendor paid separately by this many agencies
    min_spend: 5000000
    rate_low: 0.02
    rate_high: 0.05
  bid_list:
    min_agencies: 10
    min_spend: 5000000
    rate_low: 0.02
    rate_high: 0.05
    excluded_agency_codes: [CAPITAL, D06, D25]
    not_biddable: "CONSTRUCT|PAVING|CONTRACTING|MCO|HEALTH|TRUST|BANK|SCHOOL|ACADEMY|UNIVERSITY|COLLEGE|HOSPITAL|COUNTY|CITY OF|\\bJV\\b|BUS|INSURANCE|ROOF|MECHANICAL|ENGINEERS|TITLE|RESCUE|BUILDERS|EXCAVAT|BRIDGE|STEEL|CONCRETE|YESHIVA|TALMUD|HOME OF|ARC OF|COUNCIL|CHARIT|SHELTER|FAMILY|YOUTH|COMMUNITY|SERVICES FOR|CENTER FOR|SOCIETY|FOUNDATION|ASSOCIATION|BALTIMORE GAS|PEPCO|POTOMAC ELECTRIC|DELMARVA|POTOMAC EDISON|WASHINGTON GAS LIGHT|SCHLOSSER|MYERS|ZIMMER|CHRISTMAN"

# Savings checks (src/models/savings.py): GMI's reported savings paired with the payments that would show them.
savings:
  first_fy: 2022               # payments considered from this fiscal year
  before_fy: 2025              # a check compares payments in this year ...
  after_fy: 2026               # ... with this year
  seen_share: 0.5              # "Seen" when payments fell by at least this share of the reported saving
  vendor_moves:
    years: [2024, 2025, 2026]  # the three years shown; the last two are compared
    min_agencies: 5            # GMI renegotiated statewide procurement contracts: vendors paid by this many agencies
    min_before: 1000000        # and paid at least this in the earlier year
    top: 40                    # the largest decreases shown
    excluded_agency_codes: [CAPITAL, D06, D25]   # operating spending only
    not_procurement: "CONSTRUCT|PAVING|CONTRACTING|MCO|HEALTH PLAN|PARTNERS MCO|TRUST|BANK|SCHOOL|ACADEMY|UNIVERSITY|COLLEGE|HOSPITAL|COUNTY|CITY OF|\\bJV\\b|BUS SALES|NOVA BUS|INSURANCE|MEDICAL CENTER|YESHIVA|TALMUD|BNOS|ROOF|MECHANICAL|CORPS OF ENGINEERS|HEALTH|TITLE|RESCUE|BUILDERS|EXCAVAT|BRIDGE|STEEL|CONCRETE"

# Recommendations (src/models/recommendations.py): the Overview's six recommendations as tracked tables.
recommendations:
  target_saving: 50000000      # the path to this many dollars a year
  matched_fy: 2026             # recommendation 5 reports the share of this year's payments matched to an agency
  vendor_detail:
    first_fy: 2022             # drill-down tables from this year
    names_fy: 2026             # payee names merged into a vendor, by this year's payments
  plan:
    forecast_fy: 2027          # step 1 applies GMI's reported rates to this year's forecast median
    contract_rate: 0.035       # assumed saving on a statewide contract (assumed range 2-5%)
    fallback_rate: 0.01        # assumed saving in the fallback areas if the contracts fall short
    fallback_areas: ["Real estate & leases", "Utilities & facility energy"]
